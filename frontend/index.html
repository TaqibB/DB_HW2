<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarket GUI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src ="app.js" defer></script>
</head>
<body>
    <h1>Supermarket Functionality</h1>
    <fieldset class = "stackedFieldset">
        <legend>Connection Status</legend>

        <label for = "healthCheck">Check Backend Connection</label>
        <button id = "healthCheck" name = "healthCheck">Check Connection</button>

        <section>
            <h3>Status / Output:</h3>
            <pre id = "outputLog">Awaiting action...</pre>
        </section>       


    </fieldset>

    <fieldset class = "stackedFieldset">
        <legend>Table Functionality</legend>

        <label for = "randomInit">Use Random Data</label>
        <button id = "randomInit">Initialize Data</button>
        
        <label for = "tableSelect">Or Manually Enter Testcases</label>
        <select name = "tableSelect" id = "tableSelect">
            <option value = "">Select a Table</option>
            <option value = "stateTax">State Tax</option>
            <option value = "store">Store</option>
            <option value = "aisle">Aisle</option>
            <option value = "inventory">Inventory</option>
            <option value = "purchaseItem">Purchase Item</option>
            <option value = "product">Product</option>
            <option value = "purchase">Purchase</option>
            <option value = "customer">Customer</option>
            <option value = "bankAccount">Bank Account</option>
        </select>
        
        <div id = tableContainer></div>
    </fieldset>
</body>
</html>
